plugins { id 'com.android.application' }
android {
    namespace 'com.notepocket.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.notepocket.notes'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [appLabel: 'NotePocket']
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (System.getenv('NP_KEYSTORE')) {
                storeFile file(System.getenv('NP_KEYSTORE'))
                storePassword System.getenv('NP_STORE_PASSWORD')
                keyAlias System.getenv('NP_KEY_ALIAS')
                keyPassword System.getenv('NP_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            manifestPlaceholders = [appLabel: 'NotePocket ทดลอง']
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
// Never distribute a release silently signed with a disposable debug key.
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && !System.getenv('NP_KEYSTORE')) {
    throw new GradleException('Release signing is not configured. Add ANDROID_SIGNING_BUNDLE to GitHub Actions secrets.')
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
