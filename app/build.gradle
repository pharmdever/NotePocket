plugins { id 'com.android.application' }
android {
    namespace 'com.notepocket.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.notepocket.notes'
        minSdk 26
        targetSdk 35
        versionCode = (project.findProperty('notePocketVersionCode') ?: '9').toInteger()
        versionName '0.9.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [appLabel: 'NotePocket']
    }
    testBuildType = project.hasProperty('testRelease') ? 'release' : 'debug'
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (System.getenv('NP_KEYSTORE')) {
                storeFile file(System.getenv('NP_KEYSTORE'))
                storePassword System.getenv('NP_STORE_PASSWORD')
                keyAlias System.getenv('NP_KEY_ALIAS')
                keyPassword System.getenv('NP_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            manifestPlaceholders = [appLabel: 'NotePocket ทดลอง']
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
// Never distribute a release silently signed with a disposable debug key.
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && !System.getenv('NP_KEYSTORE')) {
    throw new GradleException('Release signing is not configured. Add ANDROID_SIGNING_BUNDLE to GitHub Actions secrets.')
}
dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
