name: Build and test NotePocket
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and lint
        run: gradle assembleDebug assembleDebugAndroidTest lintDebug
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Device tests and update preservation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/device_tests.sh
      - name: Configure persistent release key
        if: env.ANDROID_SIGNING_BUNDLE != ''
        run: python3 tools/restore_signing.py
      - name: Build signed release
        if: env.ANDROID_SIGNING_BUNDLE != ''
        run: gradle assembleRelease lintRelease
      - name: Release signing status
        if: env.ANDROID_SIGNING_BUNDLE == ''
        run: echo 'Release APK is pending. Add ANDROID_SIGNING_BUNDLE in repository Actions secrets and run this workflow again. The debug build is for QA only.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success() && env.ANDROID_SIGNING_BUNDLE != ''
        with:
          name: NotePocket-0.2.0-install
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NotePocket-QA-reports
          path: |
            qa-output/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - name: Remove runner key material
        if: always()
        run: rm -rf "${RUNNER_TEMP}/notepocket-signing"
